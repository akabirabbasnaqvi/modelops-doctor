name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modelops_user
          POSTGRES_PASSWORD: modelops_password
          POSTGRES_DB: modelops_doctor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd
          "pg_isready -U modelops_user -d modelops_doctor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DEBUG: "false"
      LOG_LEVEL: INFO
      POSTGRES_USER: modelops_user
      POSTGRES_PASSWORD: modelops_password
      POSTGRES_DB: modelops_doctor_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      CELERY_TASK_ALWAYS_EAGER: "true"
      STORAGE_PATH: ./storage
      CORS_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Audit dependencies for known vulnerabilities
        run: |
          python -m pip_audit --strict --no-deps \
            --requirement requirements.lock.txt

      - name: Verify the lockfile still satisfies requirements.txt
        run: |
          python -m pip install --dry-run --quiet \
            --constraint requirements.lock.txt \
            --requirement requirements.txt

      - name: Run Ruff linting
        run: |
          python -m ruff check app tests alembic/env.py

      - name: Check Ruff formatting
        run: |
          python -m ruff format --check app tests alembic/env.py

      - name: Run migrations
        run: |
          python -m alembic upgrade head

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  compose-smoke:
    name: Boot the whole stack from a clean checkout
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Builds every image and blocks until each service reports healthy,
      # so this proves a fresh clone boots end to end rather than only
      # proving the backend image compiles.
      - name: Start the stack
        run: |
          docker compose up --build --detach --wait --wait-timeout 300

      - name: Show running services
        run: docker compose ps

      - name: Verify the API health endpoint
        run: |
          status=$(curl --silent --show-error \
            --output /tmp/health.json \
            --write-out '%{http_code}' \
            http://localhost:8000/api/v1/health)

          echo "HTTP ${status}"
          cat /tmp/health.json
          echo

          test "${status}" = "200"
          grep -q '"status":"healthy"' /tmp/health.json
          grep -q '"service":"modelops-doctor-api"' /tmp/health.json

      - name: Verify the frontend is served
        run: |
          test "$(curl --fail --silent --show-error \
            http://localhost:5173/health)" = "healthy"

          curl --fail --silent --show-error http://localhost:5173/ \
            | grep -q '<div id="root">'

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
